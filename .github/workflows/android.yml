name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk stance-and-motion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stance-and-motion-apk
          path: stance-and-motion.apk
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Android app
          body: Install stance-and-motion.apk on an Android phone for nudges that work with the app closed.
          files: stance-and-motion.apk
